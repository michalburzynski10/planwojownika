<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>404 — nie ma takiej strony · Plan Wojownika</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--text:#f4f4f4;--text-2:#a8a8a8;--accent:#e63946}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .wrap{max-width:560px}
  .code{font-family:'Anton',sans-serif;font-size:clamp(72px,18vw,150px);line-height:.85;color:var(--accent);letter-spacing:.02em}
  h1{font-family:'Anton',sans-serif;font-size:clamp(24px,5vw,38px);margin:10px 0 16px;text-transform:uppercase;letter-spacing:.01em}
  p{color:var(--text-2);font-size:17px;line-height:1.6;margin-bottom:30px}
  a.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;padding:15px 30px;border-radius:10px;font-size:16px}
  a.btn:hover{filter:brightness(1.08)}
  .small{margin-top:22px;font-size:14px}
  .small a{color:var(--text-2)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Zabłądziłeś, wojowniku</h1>
    <p>Tej strony nie ma. Może została przeniesiona, może nigdy nie istniała. Wróć na właściwą ścieżkę i działaj dalej.</p>
    <a class="btn" href="/">Wróć na stronę główną</a>
    <div class="small"><a href="/historia.html">albo poznaj historię Michała →</a></div>
  </div>
</body>
</html>
